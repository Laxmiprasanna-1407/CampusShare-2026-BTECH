spring:
  application:
    name: campusshare-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  cache:
    type: caffeine
    cache-names: categories,item-details,items-list
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m
  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 50
        thread-name-prefix: campusshare-async-

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:campusshare_jwt_super_secure_secret_key_2026_capstone_must_be_long_enough_256bit}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  admin:
    email: ${ADMIN_EMAIL:admin@campusshare.edu}
    password: ${ADMIN_PASSWORD:Admin@Campus2026!}
    name: ${ADMIN_NAME:Campus Administrator}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  llm:
    api-key: ${LLM_API_KEY:}
    api-url: ${LLM_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${LLM_MODEL:gpt-3.5-turbo}
    timeout-ms: ${LLM_TIMEOUT_MS:10000}
    max-context-items: ${LLM_MAX_CONTEXT_ITEMS:6}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.campusshare: DEBUG
    org.springframework.security: INFO
